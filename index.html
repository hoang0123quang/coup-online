<script>
        // MẠCH PHÁT PHẲNG NẠP ĐỆM MỞ KHÓA ÂM THANH BẤT BẠI TRÊN TRÌNH DUYỆT MẠNG
        window.playWebAudioSFX = function (soundFile, volume) {
            try {
                var audio = new Audio('sounds/' + soundFile);
                audio.volume = volume;
                audio.play();
            } catch (e) {
                console.log("Nghẽn mạch phát loa: " + e);
            }
        };
</script>

    <!-- BỘ TRỘN ÂM THANH ĐA KÊNH CHUYÊN NGHIỆP CHO GAME WEB THẦY QUẢNG -->
    <!-- BỘ TRỘN ÂM THANH ĐA KÊNH ĐẦY ĐỦ 100% CHO GAME WEB THẦY QUẢNG -->
    <script>
                                // Khởi tạo các kênh âm thanh tĩnh trong bộ nhớ đệm trình duyệt
// Khởi tạo các kênh âm thanh tĩnh trong bộ nhớ đệm trình duyệt
const gameAudioChannels = {
                    "music_bg.wav": new Audio('sounds/music_bg.wav'),
                    "move.wav": new Audio('sounds/move.wav'),
                    "capture.wav": new Audio('sounds/capture.wav'),
                    "flip.wav": new Audio('sounds/flip.wav'),
                    "win.wav": new Audio('sounds/win.wav'),
                    "chieu.wav": new Audio('sounds/chieu.wav'),
                    "lose.wav": new Audio('sounds/lose.wav'),
                    "winGT.wav": new Audio('sounds/winGT.wav')// THÊM CHÍNH XÁC KÊNH NÀY ĐỂ KÍCH HOẠT TIẾNG THUA CUỘC
};


                                // Cấu hình riêng cho kênh Nhạc Nền chạy lặp vô hạn
                                gameAudioChannels["music_bg.wav"].loop = true;

                                window.playWebAudioSFX = (soundFile, volumeValue) => {
                                    try {
                                        let audio = gameAudioChannels[soundFile];
                                        if (audio) {
                                            // Nếu là tệp hiệu ứng ngắn (move, capture, flip, chieu), reset thời gian về 0 để phát lập tức
                                            if (soundFile !== "music_bg.wav") {
                                                audio.currentTime = 0;
                                            }
                                            audio.volume = volumeValue;
                                            audio.play().catch(e => console.log("Trình duyệt chờ tương tác để phát âm thanh"));
                                        }
                                    } catch (ex) {
                                        console.log("Lỗi bộ trộn âm thanh: " + ex);
                                    }
                                };

                                window.stopWebAudioSFX = (soundFile) => {
                                    try {
                                        let audio = gameAudioChannels[soundFile];
                                        if (audio) { audio.pause(); audio.currentTime = 0; }
                                    } catch (e) {}
                                };
    </script>
    <script>
            // MẠCH MỞ KHÓA LOA PHẲNG TỰ ĐỘNG SỬA ĐƯỜNG DẪN BẤT BẠI TRÊN MẠNG GITHUB
            window.playWebAudioSFX = function (soundFile, volume) {
                try {
                    // Tự động kiểm tra nếu code gọi thiếu chữ 'sounds/', hệ thống sẽ tự nới mạch gộp vào cho đúng
                    var correctPath = soundFile.startsWith('sounds/') ? soundFile : 'sounds/' + soundFile;
                    var audio = new Audio(correctPath);
                    audio.volume = volume;
                    audio.play();
                } catch (e) {
                    console.log("Nghẽn mạch phát loa: " + e);
                }
            };
    </script>
